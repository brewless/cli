name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The actions are taken by commit, not by tag: a tag can be moved to other code,
# a commit cannot. To update one, change the commit and the version behind it together.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git: nothing after the checkout needs it.
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
        if: matrix.php == '8.4'
      - run: vendor/bin/pest
      # The phar every release carries has to start on each of them.
      - run: builds/brewless --version
