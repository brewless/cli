name: Release

# The client is built before the tag and committed as builds/brewless, because
# that file is what Composer installs. A tag v1.2.3 checks that the committed
# build says 1.2.3 and attaches it to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The actions are taken by commit, not by tag: a tag can be moved to other code,
# a commit cannot. To update one, change the commit and the version behind it together.
jobs:
  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pest
      - run: test "$(builds/brewless --version)" = "Brewless ${GITHUB_REF_NAME#v}"
      - run: |
          cd builds
          sha256sum brewless > brewless.sha256
      - run: gh release create "$GITHUB_REF_NAME" builds/brewless builds/brewless.sha256 --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
